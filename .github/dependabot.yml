version: 2
updates:
  # Python: security updates only. A limit of 0 turns off version updates;
  # security updates have their own limit. Advisories raised together are
  # fixed in one PR, so they do not conflict over uv.lock.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    commit-message:
      prefix: build
      include: scope
    groups:
      python-security:
        applies-to: security-updates
        patterns: ["*"]

  # Actions are pinned to commit SHAs, and Dependabot raises no alerts for
  # SHA-pinned actions, so version updates are the only way to get their
  # fixes. The cooldown skips releases newer than a week.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
      include: scope
    groups:
      github-actions:
        patterns: ["*"]
