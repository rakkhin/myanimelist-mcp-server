version: 2
updates:
  # Python: version updates of every locked package, transitive ones
  # included, so fixes arrive even when GitHub raises no alert for them.
  # Updates of each kind go in one PR, so they do not conflict over uv.lock.
  # The cooldown skips releases newer than a week; security updates, raised
  # as soon as an alert is, ignore it.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    allow:
      - dependency-type: all
    commit-message:
      prefix: build
      include: scope
    groups:
      python:
        applies-to: version-updates
        patterns: ["*"]
      python-security:
        applies-to: security-updates
        patterns: ["*"]

  # Actions are pinned to commit SHAs, and Dependabot raises no alerts for
  # SHA-pinned actions, so version updates are the only way to get their
  # fixes. The cooldown skips releases newer than a week.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
      include: scope
    groups:
      github-actions:
        patterns: ["*"]
