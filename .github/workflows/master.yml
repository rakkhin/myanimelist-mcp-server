name: Master

on:
  push:
    branches: [master]

jobs:
  version:
    uses: ./.github/workflows/version.yml
    permissions:
      contents: read

  container:
    needs: version
    uses: ./.github/workflows/container.yml
    with:
      version: ${{ needs.version.outputs.semver }}
    permissions:
      contents: read
      packages: write # push to ghcr.io
