name: Container

# Builds the image from the Dockerfile for amd64 and arm64 (such as a 64-bit
# Raspberry Pi) and pushes it to the GitHub Container Registry as
# ghcr.io/<owner>/<repository>, tagged with the given version and, when called
# for a push to the default branch, also as latest. The caller's job must
# grant packages: write.
on:
  workflow_call:
    inputs:
      version:
        description: Image tag, such as the semver output of the Version workflow
        required: true
        type: string

# No concurrency group: in a called workflow github.workflow is the caller's
# name, so a group here would match the caller's own group and wait on it.

jobs:
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write # push to ghcr.io
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Emulates arm64 on the amd64 runner for the arm64 build.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Also adds the OCI labels, including the source repository, which links
      # the package to this repository on GitHub.
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ inputs.version }}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
