[project]
name = "myanimelist-mcp-server"
version = "0.1.0"
description = "MCP server for MyAnimeList.net using the official API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "fastmcp~=4.0",
    "python-dotenv>=1.1.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]

[tool.coverage.report]
exclude_also = [
    'if __name__ == "__main__":',
]
